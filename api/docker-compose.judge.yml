services:
  api:
    build:
      context: .
      dockerfile: docker/judge/Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      EXECUTION_TIMEOUT_MS: 3000
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
